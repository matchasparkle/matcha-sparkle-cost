<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18372d"><link rel="manifest" href="manifest.webmanifest"><title>Matcha Sparkle 原価管理</title><style>
:root{--ink:#18372d;--green:#3b765e;--paper:#f4f0e7;--white:#fffdfa;--line:#dcd7cb;--muted:#6d7d76;--lime:#dbff78}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select{font:inherit}header{padding:25px 5vw;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font:30px Georgia,serif}header p{margin:4px 0;color:#bed0c8;font-size:13px}.badge{border:1px solid #ffffff40;border-radius:30px;padding:8px 12px;font-size:12px}.badge:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#94e59d;margin-right:7px}nav{display:flex;overflow:auto;padding:0 5vw;background:var(--white);border-bottom:1px solid var(--line)}nav button{border:0;border-bottom:3px solid transparent;background:none;padding:17px 15px;color:var(--muted);font-weight:700;white-space:nowrap}nav button.on{color:var(--ink);border-color:var(--green)}main{width:min(1120px,92vw);margin:30px auto 70px}.hero{background:var(--green);color:#fff;border-radius:22px;padding:38px;display:flex;justify-content:space-between;align-items:center}.hero h2{font:clamp(34px,6vw,58px)/1.12 Georgia,"Yu Mincho",serif;margin:6px 0 12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#9aaba4;margin:0 0 7px}.hero .eyebrow{color:#d7ef93}.ring{width:165px;height:165px;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,var(--green) 57%,transparent 58%),conic-gradient(var(--lime) var(--rate),#ffffff2b 0)}.ring strong{font-size:34px}.ring small{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:16px 0}.card,.panel{background:var(--white);border:1px solid var(--line);border-radius:17px}.card{padding:20px}.card span,.card small{display:block;color:var(--muted)}.card strong{font:34px Georgia,serif;display:block;margin:11px 0 5px}.panel{padding:28px;margin-top:17px}.panel h2{font:34px Georgia,"Yu Mincho",serif;margin:4px 0 20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.primary{background:var(--ink)!important;color:#fff!important;border:0;border-radius:9px;padding:11px 16px}.search{padding:11px;border:1px solid var(--line);border-radius:9px;width:min(350px,100%);margin:15px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e8e4da;font-size:13px}th{color:var(--muted);font-size:11px}.rate{padding:5px 8px;border-radius:7px;font-weight:800;background:#e1efdf}.rate.bad{background:#fae2db;color:#9b3f2d}.actions button{border:0;border-radius:6px;padding:7px;margin:2px}.danger{color:#9e4535;background:#f9e9e5}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form label{font-size:12px;color:var(--muted);font-weight:700}.form input,.form select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}.wide{grid-column:1/-1}.form-actions{text-align:right}.form-actions button{margin-left:8px;padding:10px 14px;border:0;border-radius:8px}.analysis>div{margin:22px 0}.barline{display:flex;justify-content:space-between}.bar{height:11px;border-radius:8px;background:#e4e4da;margin:7px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:8px}.calc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:20px;align-items:center}.calc label{font-size:12px;font-weight:700;color:var(--muted)}.calc input{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:6px}.result{background:var(--green);color:#fff;border-radius:13px;padding:20px;text-align:center}.result strong{font-size:34px;display:block}.history>div{padding:12px 0;border-bottom:1px solid var(--line)}.history small{display:block;color:var(--muted);margin-top:4px}.backup{display:flex;gap:8px}.backup button,.backup label{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--green);font-weight:700;cursor:pointer}.backup input{display:none}.empty{color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}@media(max-width:720px){header span:last-child{display:none}.hero{align-items:flex-start;flex-direction:column;gap:25px;padding:27px}.ring{width:130px;height:130px}.cards{grid-template-columns:1fr}.panel{padding:20px}.form,.calc{grid-template-columns:1fr}.wide{grid-column:auto}.calc>span{display:none}.panel-head{align-items:flex-start}.backup{flex-direction:column}}
</style></head><body><header><div><h1>Matcha Sparkle</h1><p>原価率管理アプリ</p></div><div><span id="network" class="badge">オンライン</span> <span>適正原価率 27%–30%</span></div></header><nav id="nav"></nav><main id="app"></main><footer>データはこのブラウザ内に自動保存されます</footer><script>
const initial={products:[{id:'p1',name:'クラシック抹茶ラテ',category:'ドリンク',price:880,cost:265,status:'確定'},{id:'p2',name:'抹茶白玉パフェ',category:'スイーツ',price:950,cost:266,status:'確定'},{id:'p3',name:'白玉トッピング',category:'トッピング',price:150,cost:40,status:'試作'}],ingredients:[['抹茶','粉末類','京都茶業',3000,100,'g'],['お湯','液体類','水道局',200,1000,'g'],['氷','その他','製氷会社',150,3000,'g'],['牛乳','液体類','○○乳業',300,1000,'g'],['プラカップ','包装材','包装資材会社',2500,100,'g'],['ストロー','包装材','包装資材会社',1000,200,'g'],['ホイップクリーム','トッピング','乳製品会社',800,1000,'g'],['白玉','トッピング','和菓子材料店',500,50,'g'],['黒蜜','液体類','調味料会社',400,800,'g'],['小豆','トッピング','豆類商社',600,1000,'g']].map((x,i)=>({id:'i'+i,name:x[0],category:x[1],supplier:x[2],price:x[3],size:x[4],unit:x[5]})),logs:[{id:'l1',at:'初期データ',text:'既存アプリのデータを取り込みました'}]};
let data;try{data=JSON.parse(localStorage.getItem('matcha-cost-data-v1'))||structuredClone(initial)}catch(e){data=structuredClone(initial)}let tab='ダッシュボード',edit=null;const tabs=['ダッシュボード','商品一覧','商品登録','原材料管理','計算機','分析','履歴'];const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP'),rate=p=>p.price?p.cost/p.price*100:0,id=()=>Date.now()+'-'+Math.random().toString(36).slice(2),date=()=>new Date().toLocaleString('ja-JP');
function save(text){if(text)data.logs.unshift({id:id(),at:date(),text});localStorage.setItem('matcha-cost-data-v1',JSON.stringify(data));render()}
function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${x===tab?'on':''}" data-tab="${x}">${x}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='商品登録')edit=null;render()})}
function shell(s){document.querySelector('#app').innerHTML=s;nav()}
function dashboard(){let avg=data.products.reduce((a,p)=>a+rate(p),0)/(data.products.length||1),over=data.products.filter(p=>rate(p)>30);shell(`<section class="hero"><div><p class="eyebrow">OVERVIEW</p><h2>今日の原価を、<br>すっきり把握。</h2><p>入力内容はこの端末に自動保存されます。</p></div><div class="ring" style="--rate:${Math.min(avg,100)*3.6}deg"><strong>${avg.toFixed(1)}%</strong><small>全体平均</small></div></section><section class="cards">${[['登録商品',data.products.length+'品','全カテゴリー'],['平均原価率',avg.toFixed(1)+'%',avg<=30?'適正範囲':'要見直し'],['基準超過',over.length+'品','30%を超える商品']].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</section><section class="panel"><h2>要チェック商品</h2>${over.length?over.map(p=>`<p><b>${p.name}</b>　${rate(p).toFixed(1)}%</p>`).join(''):'<p class="empty">原価率30%超の商品はありません。</p>'}</section>`)}
function products(){shell(`<section class="panel"><div class="panel-head"><div><p class="eyebrow">PRODUCTS</p><h2>商品一覧</h2></div><button class="primary" id="addp">＋ 商品登録</button></div><div class="table-wrap"><table><thead><tr><th>商品名</th><th>カテゴリー</th><th>販売価格</th><th>原価</th><th>原価率</th><th>状態</th><th></th></tr></thead><tbody>${data.products.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.category}</td><td>${yen(p.price)}</td><td>${yen(p.cost)}</td><td><span class="rate ${rate(p)>30?'bad':''}">${rate(p).toFixed(1)}%</span></td><td>${p.status}</td><td class="actions"><button data-pe="${p.id}">編集</button><button class="danger" data-pd="${p.id}">削除</button></td></tr>`).join('')}</tbody></table></div></section>`);document.querySelector('#addp').onclick=()=>{edit=null;tab='商品登録';render()};document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{edit=data.products.find(p=>p.id===b.dataset.pe);tab='商品登録';render()});document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{let p=data.products.find(x=>x.id===b.dataset.pd);if(confirm(p.name+'を削除しますか？')){data.products=data.products.filter(x=>x.id!==p.id);save(p.name+'を削除しました')}})}
function productForm(){let p=edit||{name:'',category:'ドリンク',price:0,cost:0,status:'試作'};shell(`<section class="panel"><p class="eyebrow">PRODUCT EDITOR</p><h2>${edit?'商品を編集':'商品を登録'}</h2><form class="form" id="pf"><label class="wide">商品名<input name="name" required value="${p.name}"></label><label>カテゴリー<select name="category">${['ドリンク','スイーツ','トッピング'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`)}</select></label><label>状態<select name="status">${['試作','確定'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`)}</select></label><label>販売価格（円）<input name="price" type="number" min="0" required value="${p.price}"></label><label>原価（円）<input name="cost" type="number" min="0" required value="${p.cost}"></label><div class="form-actions wide"><button type="button" id="cancel">キャンセル</button><button class="primary">保存する</button></div></form></section>`);document.querySelector('#cancel').onclick=()=>{tab='商品一覧';render()};document.querySelector('#pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n={id:edit?.id||id(),name:f.get('name'),category:f.get('category'),price:+f.get('price'),cost:+f.get('cost'),status:f.get('status')};if(edit)data.products=data.products.map(x=>x.id===edit.id?n:x);else data.products.push(n);tab='商品一覧';save(n.name+'を'+(edit?'更新':'登録')+'しました')}}
function ingredients(){shell(`<section class="panel"><div class="panel-head"><div><p class="eyebrow">INGREDIENTS</p><h2>原材料管理</h2></div><button class="primary" id="addi">＋ 新規登録</button></div><div id="iform"></div><div class="table-wrap"><table><thead><tr><th>材料名</th><th>カテゴリー</th><th>仕入先</th><th>仕入価格</th><th>サイズ</th><th>単価</th><th></th></tr></thead><tbody>${data.ingredients.map(i=>`<tr><td><b>${i.name}</b></td><td>${i.category}</td><td>${i.supplier}</td><td>${yen(i.price)}</td><td>${i.size}${i.unit}</td><td><b>${yen(i.price/i.size)}/${i.unit}</b></td><td class="actions"><button data-ie="${i.id}">編集</button><button class="danger" data-id="${i.id}">削除</button></td></tr>`).join('')}</tbody></table></div></section>`);document.querySelector('#addi').onclick=()=>ingredientForm();document.querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>ingredientForm(data.ingredients.find(i=>i.id===b.dataset.ie)));document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let i=data.ingredients.find(x=>x.id===b.dataset.id);if(confirm(i.name+'を削除しますか？')){data.ingredients=data.ingredients.filter(x=>x.id!==i.id);save(i.name+'を削除しました')}})}
function ingredientForm(i={}){document.querySelector('#iform').innerHTML=`<form class="form" id="if"><label>材料名<input name="name" required value="${i.name||''}"></label><label>カテゴリー<select name="category">${['粉末類','液体類','トッピング','包装材','その他'].map(x=>`<option ${x===i.category?'selected':''}>${x}</option>`)}</select></label><label>仕入先<input name="supplier" required value="${i.supplier||''}"></label><label>仕入価格<input name="price" type="number" min="0" value="${i.price||0}"></label><label>サイズ<input name="size" type="number" min=".01" step=".01" value="${i.size||1}"></label><label>単位<input name="unit" value="${i.unit||'g'}"></label><div class="form-actions wide"><button type="button" id="ic">取消</button><button class="primary">保存</button></div></form>`;document.querySelector('#ic').onclick=()=>ingredients();document.querySelector('#if').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n={id:i.id||id(),name:f.get('name'),category:f.get('category'),supplier:f.get('supplier'),price:+f.get('price'),size:+f.get('size'),unit:f.get('unit')};if(i.id)data.ingredients=data.ingredients.map(x=>x.id===i.id?n:x);else data.ingredients.push(n);save(n.name+'を'+(i.id?'更新':'登録')+'しました')}}
function calculator(){shell(`<section class="panel"><p class="eyebrow">QUICK CALCULATOR</p><h2>原価率計算機</h2><div class="calc"><label>販売価格<input id="cp" type="number" value="880"></label><span>÷</span><label>原価<input id="cc" type="number" value="265"></label><span>=</span><div class="result"><strong id="cr">30.1%</strong><small id="cs">見直し推奨</small></div></div></section>`);let cp=document.querySelector('#cp'),cc=document.querySelector('#cc'),cr=document.querySelector('#cr'),cs=document.querySelector('#cs');let calc=()=>{let r=(+cc.value)/(+cp.value||1)*100;cr.textContent=r.toFixed(1)+'%';cs.textContent=r>30?'見直し推奨':r>=27?'適正範囲':'低原価'};cp.oninput=cc.oninput=calc}
function analysis(){shell(`<section class="panel"><p class="eyebrow">ANALYSIS</p><h2>カテゴリー分析</h2><div class="analysis">${['ドリンク','スイーツ','トッピング'].map(c=>{let ps=data.products.filter(p=>p.category===c),a=ps.reduce((s,p)=>s+rate(p),0)/(ps.length||1);return `<div><div class="barline"><b>${c}</b><span>${a.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(a,100)}%"></i></div><small>${ps.length}商品</small></div>`}).join('')}</div></section>`)}
function history(){shell(`<section class="panel"><div class="panel-head"><div><p class="eyebrow">HISTORY & BACKUP</p><h2>変更履歴</h2></div><div class="backup"><button id="export">バックアップ保存</button><label>読み込み<input id="import" type="file" accept="application/json"></label></div></div><div class="history">${data.logs.map(l=>`<div><b>${l.text}</b><small>${l.at}</small></div>`).join('')}</div></section>`);document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='原価データ.json';a.click()};document.querySelector('#import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save('バックアップを読み込みました')}catch(e){alert('読み込めませんでした')}};r.readAsText(e.target.files[0])}}
function render(){if(tab==='ダッシュボード')dashboard();if(tab==='商品一覧')products();if(tab==='商品登録')productForm();if(tab==='原材料管理')ingredients();if(tab==='計算機')calculator();if(tab==='分析')analysis();if(tab==='履歴')history()}
function net(){document.querySelector('#network').textContent=navigator.onLine?'オンライン':'オフライン'}addEventListener('online',net);addEventListener('offline',net);net();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
